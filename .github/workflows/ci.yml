name: CI

# Valida cada pull request e push em `deploy`.
# O deploy é feito pelo Cloudflare Workers Builds:
#   push em `deploy` -> produção; pull request/branch -> prévia.
on:
  pull_request:
  push:
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
